robot:
  model: generic_6dof_manipulator
  joints:
    - joint_1
    - joint_2
    - joint_3
    - joint_4
    - joint_5
    - joint_6
  joint_limits_rad:
    joint_1: [-3.14159, 3.14159]
    joint_2: [-2.0944, 2.0944]
    joint_3: [-2.61799, 2.61799]
    joint_4: [-3.14159, 3.14159]
    joint_5: [-2.0944, 2.0944]
    joint_6: [-6.28318, 6.28318]
  velocity_limits_rad_per_s:
    joint_1: 1.5
    joint_2: 1.5
    joint_3: 1.5
    joint_4: 2.0
    joint_5: 2.0
    joint_6: 2.0
  gripper:
    type: parallel_jaw
    stroke_m: 0.08
    force_limit_n: 100.0
    closed_position_m: 0.005
    open_position_m: 0.08
  moveit:
    planning_group: manipulator
    planner_id: RRTConnectkConfigDefault
    planning_time_sec: 5.0
    max_velocity_scaling_factor: 0.3
    max_acceleration_scaling_factor: 0.3
